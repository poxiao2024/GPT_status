<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GPT Status</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 50px 24px;
        }

        .header {
            margin-bottom: 32px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            margin-top: 8px;
            color: #6b7280;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .account-name {
            font-size: 20px;
            font-weight: bold;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            font-size: 16px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .normal {
            background: #22c55e;
        }

        .degraded {
            background: #ef4444;
        }

        .expired {
            background: #f59e0b;
        }

        .info {
            margin-top: 16px;
            color: #6b7280;
            font-size: 16px;
            line-height: 1.8;
        }

        .usage-item {
            margin-top: 16px;
        }
        
        .usage-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #6b7280;
            font-size: 16px;
        }
        
        .progress {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 999px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: #22c55e;
            border-radius: 999px;
            transition: width 0.3s ease;
        }

        .footer {
            margin-top: 36px;
            text-align: center;
            color: #9ca3af;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>ChatGPT Account Monitor</h1>
        <p>ChatGPT 账号运行状态面板</p>
    </div>


    <div class="grid" id="account-grid"></div>


    <div class="footer" id="footer">
    Loading...
    </div>

</div>
<script>
    fetch("status.json")
        .then(response => response.json())
        .then(data => {

            const grid = document.getElementById("account-grid");

            data.accounts.forEach(account => {

                const card = document.createElement("div");
                card.className = "card";

                card.innerHTML = `
                    <div class="card-header">
                        <div class="account-name">${account.name}</div>
                    </div>

                    <div class="status">
                        <div class="dot ${account.status}"></div>
                        ${account.status === "normal" ? "Normal" : "Degraded"}
                    </div>

                    <div class="info">

                        <div class="usage-item">
                            <div class="usage-label">
                                <span>5-hour remaining</span>
                                <span>${account.five_hour_remaining}%</span>
                            </div>
                    
                            <div class="progress">
                                <div class="progress-bar"
                                     style="width: ${account.five_hour_remaining}%;">
                                </div>
                            </div>
                        </div>
                    
                    
                        <div class="usage-item">
                            <div class="usage-label">
                                <span>Weekly remaining</span>
                                <span>${account.weekly_remaining}%</span>
                            </div>
                    
                            <div class="progress">
                                <div class="progress-bar"
                                     style="width: ${account.weekly_remaining}%;">
                                </div>
                            </div>
                    </div>
                
                
                    <div style="margin-top: 18px;">
                        Last Check: ${account.last_check}
                    </div>
                
                </div>
                `;

                grid.appendChild(card);
            });

            document.getElementById("footer").textContent =
                "Last updated: " + data.updated;
        })

        .catch(error => {
            console.error("Failed to load status.json:", error);

            document.getElementById("footer").textContent =
                "Failed to load status data";
        });
</script>
</body>
</html>
